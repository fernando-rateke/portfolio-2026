<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rateke</title>
<link rel="icon" href="/rateke-icone.svg">
<style>
  html, body { margin: 0; height: 100%; background: #1a1418; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #abertura { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 60%, #3a2430 0%, #1a1418 70%); color: #f2e8dc; font-family: "Noto Serif JP", "Hiragino Mincho ProN", Georgia, serif; transition: opacity 1.4s ease; }
  #abertura.fim { opacity: 0; pointer-events: none; }
  #abertura .bx { text-align: center; padding: 0 16px; }
  #abertura .kj { font-size: 13px; letter-spacing: .6em; opacity: .7; margin-bottom: 14px; }
  #abertura h1 { font-weight: 500; font-size: clamp(26px, 5vw, 40px); letter-spacing: .08em; margin: 0 0 26px; }
  #abertura .linha { width: min(260px, 60vw); height: 1px; background: rgba(242,232,220,.18); margin: 0 auto; overflow: hidden; }
  #abertura .linha i { display: block; height: 100%; width: 0; background: #e8a070; transition: width .4s ease; }
  #abertura .dica { margin-top: 16px; font-size: 13px; opacity: .55; letter-spacing: .04em; }
  #abertura .peso { margin-top: 26px; display: grid; justify-items: center; gap: 10px; }
  #abertura .peso div { display: flex; gap: 2px; padding: 3px; border: 1px solid rgba(242,232,220,.3); border-radius: 999px; }
  #abertura .peso button { min-height: 44px; min-width: 112px; padding: 6px 16px; border: 0; border-radius: 999px; background: transparent; color: #f2e8dc; font: 500 15px/1.1 "Noto Serif JP", Georgia, serif; cursor: pointer; }
  #abertura .peso button:hover, #abertura .peso button:focus-visible { background: rgba(242,232,220,.1); }
  #abertura .peso button[aria-pressed="true"] { background: #f2e8dc; color: #2a1c24; }
  #abertura .peso p { margin: 0; max-width: 320px; min-height: 2.6em; font-size: 13px; opacity: .65; line-height: 1.35; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="abertura" role="status" aria-live="polite"><div class="bx"><div class="kj">ラテケ</div><h1>Fernando Rateke</h1><div class="linha"><i></i></div><div class="dica">Carregando a cidade…</div>
  <div class="peso" role="group" aria-label="Qualidade"><div><button type="button" data-peso="leve">Leve</button><button type="button" data-peso="completo">Completo</button></div><p></p></div></div></div>
<script src="/vale/three.min.js"></script>
<script>
  // a barra de carregamento acompanha todos os modelos e texturas
  (() => { const bar = document.querySelector("#abertura .linha i"); let max = 0;
    THREE.DefaultLoadingManager.onProgress = (u, a, b) => { const p = Math.max(max, a / Math.max(b, 1)); max = p; bar.style.width = (p * 100).toFixed(0) + "%"; };
    const fim = () => { const ab = document.getElementById("abertura"); if (!ab) return; bar.style.width = "100%"; ab.querySelector(".dica").textContent = matchMedia("(pointer: coarse)").matches ? "Deslize para andar. Toque nos nomes acesos para abrir." : "Role ou use as setas para andar. Clique nos nomes acesos para abrir."; setTimeout(() => ab.classList.add("fim"), 1600); };
    const w = setInterval(() => { if (window.cidadePronta) { clearInterval(w); fim(); } }, 200);
    // Leve ou Completo (a mesma regra de cidade.js): trocar aqui recomeça o carregamento já no modo escolhido
    const Q = new URLSearchParams(location.search); let salvo = null; try { salvo = localStorage.getItem("cidade-peso"); } catch (e) { /* sem storage */ }
    const atual = Q.has("leve") ? "leve" : Q.has("completo") ? "completo" : salvo === "leve" || salvo === "completo" ? salvo : matchMedia("(pointer: coarse)").matches ? "leve" : "completo";
    const TXT = { leve: "Para celular e computador simples: sem sombras e sem o reflexo no lago, com menos detalhes.", completo: "Tudo ligado: sombras, reflexo de verdade no lago, mais flores, plantas e vaga-lumes." };
    const caixa = document.querySelector("#abertura .peso"), p = caixa.querySelector("p");
    caixa.querySelectorAll("button").forEach((b) => { b.setAttribute("aria-pressed", String(b.dataset.peso === atual));
      b.addEventListener("mouseenter", () => (p.textContent = TXT[b.dataset.peso])); b.addEventListener("mouseleave", () => (p.textContent = TXT[atual]));
      b.addEventListener("click", () => { if (b.dataset.peso === atual) return; try { localStorage.setItem("cidade-peso", b.dataset.peso); } catch (e) { /* sem storage */ }
        const u = new URL(location.href); u.searchParams.delete("leve"); u.searchParams.delete("completo"); u.searchParams.set(b.dataset.peso, "1"); location.href = u.toString(); }); });
    p.textContent = TXT[atual]; })();
</script>
<script src="/vale/gltf.js"></script>
<script src="/cidade/meshopt.js"></script>
<script src="/cidade/cidade.js"></script>
<script src="/cidade/japao.js"></script>
<script src="/cidade/mundo.js"></script>
<script src="/cidade/natureza.js"></script>
<script src="/cidade/caminho.js"></script>
<script src="/cidade/magia.js"></script>
<script src="/cidade/conteudo.js"></script>
<script src="/cidade/lojas.js"></script>
<script src="/cidade/apresentacao.js"></script>
<script src="/cidade/tema.js"></script>
<script src="/cidade/creditos.js"></script>
</body>
</html>
