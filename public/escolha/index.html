<!doctype html>

<head>

<style>
:root { --ink: #f4efe6; --f-d: "Shippori Mincho", "Hiragino Mincho ProN", Georgia, serif; --f-m: "JetBrains Mono", ui-monospace, Menlo, monospace; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0b0b0f; color: var(--ink); }
body { overflow: hidden; font-family: var(--f-d); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid #fff; outline-offset: -6px; }
.menu { position: fixed; inset: 0; display: flex; }
.world { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 clamp(20px, 4vw, 56px) clamp(28px, 7vh, 72px); color: inherit; text-decoration: none; overflow: hidden; transition: flex-grow .7s cubic-bezier(.2,.8,.2,1); isolation: isolate; }
.world::before { content: ""; position: absolute; inset: 0; z-index: -2; background-size: cover; background-position: center; transform: scale(1.04); transition: transform 1.2s cubic-bezier(.2,.8,.2,1), filter .7s; }
.world::after { content: ""; position: absolute; inset: 0; z-index: -1; transition: opacity .7s; }
.vale::before { background-image: url("/escolha/vale-l.jpg"); filter: saturate(0.9) brightness(0.92); }
.vale::after { background: linear-gradient(180deg, rgba(20,40,70,0.0) 35%, rgba(10,24,40,0.78) 100%); }
.tg::before { background-image: url("/escolha/tg-l.jpg"); background-position: 62% center; filter: brightness(1.05); }
.tg::after { background: linear-gradient(180deg, rgba(0,0,0,0.0) 30%, rgba(8,0,2,0.86) 100%); }
.menu:hover .world:not(:hover)::before, .menu:focus-within .world:not(:focus)::before { filter: grayscale(0.7) brightness(0.5); }
.world:hover, .world:focus-visible { flex-grow: 1.6; }
.world:hover::before, .world:focus-visible::before { transform: scale(1.0); }
.w-k { font: 800 clamp(3rem, 8vw, 6.4rem)/1 var(--f-d); letter-spacing: 0.02em; margin-bottom: 10px; }
.vale .w-k { color: #fff; text-shadow: 0 4px 30px rgba(0,30,60,0.5); }
.tg .w-k { color: #ff2a2f; text-shadow: 0 0 34px rgba(255,20,30,0.55); }
.w-name { font: 800 clamp(1.7rem, 3.4vw, 2.8rem)/1.05 var(--f-d); margin: 0; }
.w-sub { margin: 10px 0 0; font: 500 0.72rem/1.6 var(--f-m); letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.8; }
.w-go { display: inline-flex; align-items: center; gap: 10px; align-self: flex-start; margin-top: 22px; min-height: 48px; padding: 12px 22px; border-radius: 999px; font: 500 0.74rem/1 var(--f-m); letter-spacing: 0.2em; text-transform: uppercase; transition: background .3s, transform .3s; }
.vale .w-go { border: 1.5px solid rgba(255,255,255,0.7); background: rgba(255,255,255,0.12); backdrop-filter: blur(6px); }
.tg .w-go { border: 1.5px solid #ff2a2f; background: rgba(120,6,12,0.45); backdrop-filter: blur(6px); }
.world:hover .w-go, .world:focus-visible .w-go { transform: translateX(6px); }
.vale:hover .w-go { background: rgba(255,255,255,0.24); } .tg:hover .w-go { background: rgba(170,8,16,0.7); }
.head { position: fixed; left: 50%; top: clamp(18px, 5vh, 46px); transform: translateX(-50%); z-index: 5; display: grid; justify-items: center; gap: 10px; text-align: center; pointer-events: none; }
.seal { width: 64px; height: 64px; display: grid; place-items: center; background: #c22026; border-radius: 9px; box-shadow: 0 10px 30px rgba(0,0,0,0.45), inset 0 0 0 3px #c22026, inset 0 0 0 5px #fff; color: #fff; font: 800 0.95rem/1.05 var(--f-d); writing-mode: vertical-rl; letter-spacing: 0.08em; }
.head h1 { margin: 0; font: 800 clamp(1.2rem, 2.2vw, 1.7rem)/1.1 var(--f-d); text-shadow: 0 2px 20px rgba(0,0,0,0.6); }
.head p { margin: 0; padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,0.45); backdrop-filter: blur(6px); font: 500 0.62rem/1.4 var(--f-m); letter-spacing: 0.22em; text-transform: uppercase; }
@media (max-aspect-ratio: 1/1) {
  .menu { flex-direction: column; }
  .world { padding-top: 0; padding-bottom: clamp(18px, 4vh, 36px); }
  .vale::before { background-image: url("/escolha/vale-p.jpg"); background-position: center 70%; }
  .tg::before { background-image: url("/escolha/tg-p.jpg"); background-position: center 40%; }
  .head { top: max(14px, env(safe-area-inset-top)); gap: 8px; }
  .head h1 { display: none; }
  .seal { width: 48px; height: 48px; font-size: 0.75rem; }
  .w-k { font-size: clamp(2.2rem, 11vw, 3.4rem); margin-bottom: 4px; }
  .w-go { margin-top: 14px; }
  .world:hover, .world:focus-visible { flex-grow: 1.25; }
}
@media (prefers-reduced-motion: reduce) { .world, .world::before { transition: none; } }
</style>
</head>
<body>
<header class="head">
  <div class="seal" aria-hidden="true">ラテケ</div>
  <h1>Fernando Rateke · Portfólio 2026</h1>
  <p>Escolha o mundo · Choose your world</p>
</header>
<main class="menu">
  <a class="world vale" href="/vale" lang="pt-BR">
    <span class="w-k" aria-hidden="true">谷</span>
    <h2 class="w-name">Studio Ghibli</h2>
    <p class="w-sub">O vale · The valley</p>
    <span class="w-go">Entrar no vale</span>
  </a>
  <a class="world tg" href="/tg" lang="pt-BR">
    <span class="w-k" aria-hidden="true">東京喰種</span>
    <h2 class="w-name">Tokyo Ghoul</h2>
    <p class="w-sub">O 20º distrito · The 20th Ward</p>
    <span class="w-go">Entrar no distrito</span>
  </a>
</main>
</body>
</html>
