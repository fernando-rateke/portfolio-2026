<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141214"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3344"/>
      <stop offset="100%" stop-color="#C22026"/>
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E4DF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#C22026" stroke-width="8" stroke-opacity="0.45"/>

  <!-- Glowing background aura behind monogram -->
  <circle cx="256" cy="256" r="140" fill="#C22026" opacity="0.22" filter="url(#glow)"/>

  <!-- MONOGRAM "FR" -->
  <g id="monogram" transform="translate(10, 0)">
    <!-- ── LETTER 'F' ── -->
    <!-- F Vertical Stem -->
    <rect x="90" y="116" width="48" height="280" rx="10" fill="url(#redGrad)"/>
    <!-- F Top Bar -->
    <rect x="90" y="116" width="154" height="46" rx="10" fill="url(#whiteGrad)"/>
    <!-- F Mid Bar -->
    <rect x="90" y="234" width="124" height="40" rx="8" fill="url(#redGrad)"/>

    <!-- ── LETTER 'R' ── -->
    <!-- R Vertical Stem -->
    <rect x="274" y="116" width="48" height="280" rx="10" fill="url(#redGrad)"/>
    <!-- R Top Loop -->
    <path d="M 274 116 L 368 116 C 418 116 418 248 368 248 L 274 248 Z" 
          fill="none" 
          stroke="url(#whiteGrad)" 
          stroke-width="46" 
          stroke-linejoin="round"
          stroke-linecap="round"/>
    <!-- R Diagonal Leg -->
    <path d="M 324 238 L 416 396" 
          fill="none" 
          stroke="url(#redGrad)" 
          stroke-width="50" 
          stroke-linecap="round"/>
  </g>

  <!-- Tech Accent Dot -->
  <circle cx="438" cy="116" r="12" fill="#FF3344" filter="url(#glow)"/>
</svg>
